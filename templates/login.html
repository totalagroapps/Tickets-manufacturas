{% extends "base.html" %}

{% block title %}Iniciar Sesión - TicketsApp{% endblock %}

{% block content %}
<div class="flex justify-center mt-16">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border border-indigo-50 p-10">
        <h2 class="text-3xl font-extrabold text-center text-slate-800 mb-8">¡Bienvenido!</h2>
        
        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-600 px-4 py-3 rounded-xl mb-6 text-sm">
            <span class="block sm:inline">{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-5">
                <label for="username" class="block text-slate-500 text-sm font-semibold mb-2">Usuario</label>
                <input type="text" name="username" id="username" required class="w-full py-3 px-4 text-slate-700 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent transition-all">
            </div>
            
            <div class="mb-8">
                <label for="password" class="block text-slate-500 text-sm font-semibold mb-2">Contraseña</label>
                <input type="password" name="password" id="password" required class="w-full py-3 px-4 text-slate-700 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-transparent transition-all">
            </div>
            
            <div class="flex items-center justify-between">
                <button type="submit" class="bg-indigo-400 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-200 w-full transition-colors">
                    Entrar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
