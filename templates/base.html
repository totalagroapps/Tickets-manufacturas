<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Tickets{% endblock %}</title>
    <meta name="theme-color" content="#818cf8">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Olamtex&background=818cf8&color=fff&size=192">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-indigo-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 font-extrabold text-xl sm:text-2xl tracking-tight text-indigo-400">
                    <a href="/">Olamtex<span class="text-slate-800">Tickets</span></a>
                </div>
                <div class="flex items-center gap-3">
                    {% if user %}
                        <span class="hidden sm:inline text-sm font-medium text-slate-500">Hola, {{ user.username }}</span>
                        <a href="/logout" class="bg-rose-300 hover:bg-rose-400 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-full text-xs sm:text-sm font-semibold transition-colors shadow-sm shadow-rose-200">Cerrar Sesión</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}{% endblock %}
    </main>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('SW registrado'))
                    .catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
